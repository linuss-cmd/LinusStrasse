name: CI

on:
  push:
    branches: [main]
    paths:
      - 'linus-strasse/**'
      - 'napkin-notes/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'linus-strasse/**'
      - 'napkin-notes/**'
      - '.github/workflows/ci.yml'

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run API tests
        working-directory: linus-strasse/services/api
        run: go test ./...

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: linus-strasse/web/package-lock.json
      - name: Install dependencies
        working-directory: linus-strasse/web
        run: npm ci
      - name: Run tests
        working-directory: linus-strasse/web
        run: npm run test

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: linus-strasse/services/fontforge
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: linus-strasse/services/fontforge
        run: python -m pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: [test-api, test-web, test-worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Ensure shared Traefik network exists
            docker network create traefik-public 2>/dev/null || true

            # Deploy linus-strasse (owns Traefik)
            cd /root/LinusStrasse
            git pull origin main
            cd linus-strasse/docker
            echo "ACME_EMAIL=${{ secrets.ACME_EMAIL }}" > .env
            docker compose up -d --build

            # Deploy napkin-notes (joins traefik-public, no own Traefik)
            cd /root/napkin-notes/napkin-notes/docker
            cat > .env << ENVEOF
DB_NAME=${{ secrets.NAPKIN_DB_NAME }}
DB_USER=${{ secrets.NAPKIN_DB_USER }}
DB_PASSWORD=${{ secrets.NAPKIN_DB_PASSWORD }}
JWT_SECRET=${{ secrets.NAPKIN_JWT_SECRET }}
ACME_EMAIL=${{ secrets.ACME_EMAIL }}
ENVEOF
            docker compose up -d --build

            docker image prune -f
