services:
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik-public

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.linus-api.rule=Host(`linusssaschek.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.linus-api.entrypoints=websecure"
      - "traefik.http.routers.linus-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.linus-api.loadbalancer.server.port=8080"
    networks:
      - traefik-public

  worker:
    build:
      context: ..
      dockerfile: docker/fontforge/Dockerfile
    restart: unless-stopped
    networks:
      - traefik-public

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.linus-web.rule=Host(`linusssaschek.com`)"
      - "traefik.http.routers.linus-web.entrypoints=websecure"
      - "traefik.http.routers.linus-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.linus-web.loadbalancer.server.port=80"
    networks:
      - traefik-public

networks:
  traefik-public:
    name: traefik-public
    external: true

volumes:
  letsencrypt:
