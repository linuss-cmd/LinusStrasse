<svg xmlns="http://www.w3.org/2000/svg" width="380" height="800" viewBox="0 0 380 800">
  <rect width="380" height="800" fill="#e8e0d0"/>
  <!-- Building structure -->
  <rect x="0" y="120" width="380" height="680" fill="#d4c8b0"/>
  <!-- Awning -->
  <rect x="0" y="120" width="380" height="60" fill="#ff5500"/>
  <text x="190" y="160" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">Plattenladen</text>
  <!-- Window display -->
  <rect x="30" y="210" width="140" height="180" fill="#f0e8d8" rx="2"/>
  <!-- Record in window -->
  <circle cx="100" cy="300" r="60" fill="#222"/>
  <circle cx="100" cy="300" r="20" fill="#ff5500"/>
  <circle cx="100" cy="300" r="5" fill="#222"/>
  <rect x="210" y="210" width="140" height="180" fill="#f0e8d8" rx="2"/>
  <circle cx="280" cy="300" r="60" fill="#333"/>
  <circle cx="280" cy="300" r="20" fill="#ff5500"/>
  <circle cx="280" cy="300" r="5" fill="#333"/>
  <!-- Soundwave graphic -->
  <rect x="60" y="430" width="8" height="40" fill="#ff5500" rx="4"/>
  <rect x="80" y="415" width="8" height="70" fill="#ff5500" rx="4"/>
  <rect x="100" y="400" width="8" height="100" fill="#ff5500" rx="4"/>
  <rect x="120" y="420" width="8" height="60" fill="#ff5500" rx="4"/>
  <rect x="140" y="435" width="8" height="30" fill="#ff5500" rx="4"/>
  <rect x="160" y="410" width="8" height="80" fill="#ff5500" rx="4"/>
  <rect x="180" y="425" width="8" height="50" fill="#ff5500" rx="4"/>
  <rect x="200" y="405" width="8" height="90" fill="#ff5500" rx="4"/>
  <rect x="220" y="430" width="8" height="40" fill="#ff5500" rx="4"/>
  <rect x="240" y="418" width="8" height="64" fill="#ff5500" rx="4"/>
  <rect x="260" y="440" width="8" height="20" fill="#ff5500" rx="4"/>
  <rect x="280" y="412" width="8" height="76" fill="#ff5500" rx="4"/>
  <rect x="300" y="432" width="8" height="36" fill="#ff5500" rx="4"/>
  <!-- Door -->
  <rect x="150" y="640" width="80" height="160" fill="#998877" rx="2"/>
  <!-- SoundCloud sign -->
  <rect x="80" y="50" width="220" height="44" fill="#ff5500" rx="6"/>
  <text x="190" y="80" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">SoundCloud</text>
</svg>
