name: napkin-notes

services:
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSLMODE: "disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      RUN_MIGRATIONS: "true"
      MIGRATIONS_PATH: "/app/migrations"
      STORAGE_PATH: "/data/storage"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.napkin-api.rule=Host(`dirtyclarks.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.napkin-api.entrypoints=websecure"
      - "traefik.http.routers.napkin-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.napkin-api.loadbalancer.server.port=8080"
    networks:
      - traefik-public
      - internal

  fontforge:
    build:
      context: ..
      dockerfile: docker/fontforge/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_URL: "redis://redis:6379"
      STORAGE_PATH: "/data/storage"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.napkin-web.rule=Host(`dirtyclarks.com`)"
      - "traefik.http.routers.napkin-web.entrypoints=websecure"
      - "traefik.http.routers.napkin-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.napkin-web.loadbalancer.server.port=80"
    networks:
      - traefik-public

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  traefik-public:
    name: traefik-public
    external: true
  internal:
    internal: true

volumes:
  pgdata:
  storage:
